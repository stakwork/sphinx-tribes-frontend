name: data-testid audit
on:
  pull_request:
    branches:
      - "*"
jobs:
  data-testid-audit:
    name: data-testid audit
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Check data-testid registry
        run: node scripts/check-data-testids.js --check
